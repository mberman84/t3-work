name: T3Work Windows release

on:
  push:
    tags:
      - "t3work-v*"

permissions:
  contents: read

concurrency:
  group: t3work-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: mberman84/t3-work
      T3CODE_TELEMETRY_CHANNEL: dev
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Resolve version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^t3work-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a t3work-vMAJOR.MINOR.PATCH release tag.' }
          "T3CODE_DESKTOP_VERSION=$version" >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-ci-deps
      - name: Enable T3 Connect public configuration
        shell: pwsh
        run: Copy-Item -LiteralPath .env.example -Destination .env
      - name: Align release versions
        shell: pwsh
        run: node scripts/update-release-package-versions.ts $env:T3CODE_DESKTOP_VERSION
      - name: Build desktop and bundled server
        run: vp run build:desktop
      - name: Package Windows installer
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --skip-build --output-dir release
      - name: Hash installer
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath release -Filter '*.exe' | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          }
          if (-not $lines) { throw 'The Windows installer was not produced.' }
          if (-not (Test-Path -LiteralPath release/latest.yml)) { throw 'The updater manifest was not produced.' }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        with:
          name: t3work-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: t3work-windows
          path: release
      - name: Publish release and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Install T3Work by downloading and running the Windows x64 .exe below.

          This personal build is unsigned. Windows may show an unknown-publisher prompt.

          On your main computer, enable T3 Connect in Settings → Sharing & access. On your other computers, sign in to the same account and connect to the main computer to share its chats, projects, files, and providers. Keep the host awake and online.

          Setup: https://github.com/mberman84/t3-work/blob/desktop-baseline/docs/user/t3work-setup.md

          Chrome sessions remain in the Chrome profile on the computer running the browser. Local app preferences and independent local conversations are not replicated.
          NOTES
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "T3Work ${GITHUB_REF_NAME#t3work-v}" --notes-file notes.md
          fi
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo 'This version is already published. Tag a higher version for another release.' >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
